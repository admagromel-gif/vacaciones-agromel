const genNum = () => {
  const n=new Date();
  return `${n.getFullYear()}${String(n.getMonth()+1).padStart(2,"0")}${String(n.getDate()).padStart(2,"0")}-${Date.now().toString().slice(-4)}`;
};
const fmtD  = d => d?new Date(d+"T12:00:00").toLocaleDateString("es-BO",{day:"2-digit",month:"2-digit",year:"numeric"}):"";
const fmtDL = d => d?new Date(d+"T12:00:00").toLocaleDateString("es-BO",{day:"numeric",month:"long",year:"numeric"}):"";
const fmtMd = (m,h) => ({DIA_COMPLETO:"Día completo",MEDIA_MANANA:"Media mañana",MEDIA_TARDE:"Media tarde",HORA:`Por horas (${h} h/día)`}[m]||m);
const hoyISO = () => new Date().toISOString().split("T")[0];

function splitNombre(nombreCompleto) {
  const parts = (nombreCompleto||"").trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return {primerApellido:"", segundoApellido:"", nombres:""};
  if (parts.length === 1) return {primerApellido:parts[0], segundoApellido:"", nombres:""};
  if (parts.length === 2) return {primerApellido:parts[0], segundoApellido:parts[1], nombres:""};
  const apellidos = parts.slice(-2);
  const nombres = parts.slice(0,-2).join(" ");
  return {primerApellido:apellidos[0], segundoApellido:apellidos[1], nombres};
}

function getFeriadoDesc(dateStr, feriadosVar=[]) {
  const md=dateStr.slice(5);
  const fijo=FERIADOS_FIJOS.find(f=>f.md===md);
  if(fijo) return fijo.desc;
  const variable=feriadosVar.find(f=>f.fecha===dateStr);
  return variable?variable.desc:null;
}

function calcDias(ini, fin, mod, hpd, feriadosVar=[], fechaNac=null, horarioSemana="L-V") {
  if(!ini||!fin) return {dias:0,feriadosEnRango:[],cumpleEnRango:null};
  let count=0;
  const feriadosEnRango=[];
  let cumpleEnRango=null;
  let cur=new Date(ini+"T12:00:00");
  const end=new Date(fin+"T12:00:00");
  const cumpleMD=fechaNac?fechaNac.slice(5):null;
  // L-V: no laboran sabado(6) ni domingo(0). L-S: solo domingo(0) no es laborable.
  const noLaborable=dow=>horarioSemana==="L-S"?dow===0:(dow===0||dow===6);
  while(cur<=end){
    const dow=cur.getDay();
    const ds=cur.toISOString().split("T")[0];
    const curMD=ds.slice(5);
    cur.setDate(cur.getDate()+1);
    if(noLaborable(dow)) continue;
    const ferDesc=getFeriadoDesc(ds,feriadosVar);
    if(ferDesc){feriadosEnRango.push({fecha:ds,desc:ferDesc});continue;}
    if(cumpleMD&&curMD===cumpleMD){cumpleEnRango=ds;count+=0.5;continue;}
    count++;
  }
  let dias=count;
  if(mod==="MEDIA_MANANA"||mod==="MEDIA_TARDE") dias=count*0.5;
  if(mod==="HORA") dias=Math.round((parseFloat(hpd)||0)*count/8*100)/100;
  return{dias,feriadosEnRango,cumpleEnRango};
}

function diasPorAnioCumplido(anioNum){
  if(anioNum<=5) return 15;
  if(anioNum<=10) return 20;
  return 30;
}
function calcDiasAcumulados(fechaIngreso, fechaRef){
  if(!fechaIngreso) return null;
  const ini=new Date(fechaIngreso+"T00:00:00");
  const ref=fechaRef?new Date(fechaRef+"T00:00:00"):new Date();
  if(isNaN(ini.getTime())||ref<=ini) return 0;
  let total=0, anioNum=1, cursor=new Date(ini);
  while(true){
    const finAnio=new Date(cursor); finAnio.setFullYear(finAnio.getFullYear()+1);
    if(finAnio<=ref){
      // Solo se acredita el bloque completo de dias al cumplirse el anio; nada se prorratea mientras tanto.
      total+=diasPorAnioCumplido(anioNum);
      cursor=finAnio; anioNum++;
    } else {
      break;
    }
  }
  return total;
}
function calcAntiguedadTxt(fechaIngreso, fechaRef){
  if(!fechaIngreso) return "";
  const ini=new Date(fechaIngreso+"T00:00:00");
  const ref=fechaRef?new Date(fechaRef+"T00:00:00"):new Date();
  if(isNaN(ini.getTime())||ref<=ini) return "menos de 1 mes";
  let years=ref.getFullYear()-ini.getFullYear();
  let months=ref.getMonth()-ini.getMonth();
  if(ref.getDate()<ini.getDate()) months--;
  if(months<0){years--;months+=12;}
  const p=[];
  if(years>0) p.push(`${years} año${years!==1?"s":""}`);
  if(months>0) p.push(`${months} mes${months!==1?"es":""}`);
  return p.length?p.join(", "):"menos de 1 mes";
}
function calcSaldoActual(emp, sols, fechaRef){
  if(!emp) return 0;
  const ref=fechaRef||hoyISO();
  const corte=emp.fechaCorteSaldo||ref;
  const base=parseFloat(emp.diasDisponibles)||0;
  const acumuladoDesdeCorte=emp.fechaIngreso
    ? (calcDiasAcumulados(emp.fechaIngreso,ref)-calcDiasAcumulados(emp.fechaIngreso,corte))
    : 0;
  const usadoDesdeCorte=(sols||[])
    .filter(s=>s.ci&&emp.ci&&s.ci===emp.ci&&s.estado==="Aprobada"&&s.tipo!=="COMPENSACION"&&s.fechaInicio&&s.fechaInicio>=corte)
    .reduce((sum,s)=>sum+(parseFloat(s.diasEstimados)||0),0);
  return Math.round((base+acumuladoDesdeCorte-usadoDesdeCorte)*10)/10;
}

// CAPA DE DATOS (Firestore)
// ============================================================
const DB = {
  async empGetAll(){
    const snap=await window.__fbDb.collection("empleados").get();
    return snap.docs.map(d=>({id:d.id,...d.data()}));
  },
  async empGetByCi(ci){
    const snap=await window.__fbDb.collection("empleados").where("ci","==",ci).get();
    if(snap.empty) return null;
    const d=snap.docs[0]; return {id:d.id,...d.data()};
  },
  async empGetByUid(uid){
    const snap=await window.__fbDb.collection("empleados").where("uid","==",uid).get();
    if(snap.empty) return null;
    const d=snap.docs[0]; return {id:d.id,...d.data()};
  },
  async empSave(emp){
    if(emp.id){ const {id,...rest}=emp; await window.__fbDb.collection("empleados").doc(id).set(rest,{merge:true}); return id; }
    const ref=await window.__fbDb.collection("empleados").add(emp); return ref.id;
  },
  async empDelete(id){
    await window.__fbDb.collection("empleados").doc(id).delete();
  },
  async solGetAll(){
    const snap=await window.__fbDb.collection("solicitudes").get();
    return snap.docs.map(d=>({id:d.id,...d.data()}));
  },
  async solCreate(sol){
    const ref=await window.__fbDb.collection("solicitudes").add(sol); return ref.id;
  },
  async solUpdate(id,data){
    await window.__fbDb.collection("solicitudes").doc(id).update(data);
  },
  async solDelete(id){
    await window.__fbDb.collection("solicitudes").doc(id).delete();
  },
  async ferGet(year){
    const snap=await window.__fbDb.collection("feriados").doc(String(year)).get();
    return snap.exists?(snap.data().items||[]):[];
  },
  async ferSet(year,items){
    await window.__fbDb.collection("feriados").doc(String(year)).set({items});
  },
  // Indice publico (lectura sin sesion) que mapea CI -> email real de Firebase Auth,
  // necesario porque el login se hace con CI pero Firebase Auth exige un email internamente.
  async loginIndexGet(ci){
    const snap=await window.__fbDb.collection("login_index").doc(ci).get();
    return snap.exists?snap.data().email:null;
  },
  async loginIndexSet(ci,email){
    await window.__fbDb.collection("login_index").doc(ci).set({email});
  },
  // Espejo minimo uid -> rol, usado por las reglas de seguridad de Firestore para verificar quien es RRHH
  // sin exponer el resto de los datos del empleado. Se actualiza cada vez que se guarda un empleado con uid.
  async roleSet(uid,esRRHH){
    if(!uid) return;
    await window.__fbDb.collection("roles").doc(uid).set({esRRHH:!!esRRHH});
  },
};

    </div>
  );
}

function PrintForm({s}) {
  const esC=s.tipo==="COMPENSACION";
  const {primerApellido,segundoApellido,nombres}=splitNombre(s.nombreEmpleado);
  const diasDisp=(s.diasDisponibles!==undefined&&s.diasDisponibles!==null&&s.diasDisponibles!=="")?parseFloat(s.diasDisponibles):null;
  const diasPendientes=diasDisp!==null?(diasDisp-(s.diasEstimados||0)):null;
  const fmtNum=n=>(n===null||n===undefined||isNaN(n))?"":n.toLocaleString("es-BO",{minimumFractionDigits:0,maximumFractionDigits:2});
  const gray="#d9d9d9", yellow="#ffff99", border="1px solid #000", F="Arial,sans-serif";
  const sh={backgroundColor:gray,border,borderBottom:"none",padding:"6px 12px",fontSize:"13px",fontWeight:"bold",fontFamily:F};
  const th2={border,backgroundColor:yellow,padding:"8px 10px",fontSize:"13px",fontWeight:"bold",textAlign:"center",fontFamily:F};
  const td2={border,padding:"10px 10px",fontSize:"13px",textAlign:"center",fontFamily:F};
  return(
    <div style={{fontFamily:F,maxWidth:"7.5in",margin:"0 auto",padding:"0.2in",backgroundColor:"white",color:"#111"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}}>
        <div>
          <img src={`data:image/png;base64,${LOGO_AGROMEL_B64}`} alt="Agromel S.R.L." style={{height:"70px",display:"block"}}/>
        </div>
        <div style={{fontSize:"13px",display:"flex",alignItems:"center",gap:"6px"}}>
          <span style={{fontWeight:"bold"}}>Código</span>
          <span style={{border,padding:"4px 14px",display:"inline-block",minWidth:"60px",textAlign:"center"}}>{s.codigo||""}</span>
        </div>
      </div>
      <div style={{textAlign:"center",marginBottom:"16px"}}>
        <div style={{fontSize:"19px",fontWeight:"bold",textDecoration:"underline"}}>FORMULARIO DE {esC?"COMPENSACIÓN":"VACACIONES"}</div>
      </div>
      <div style={sh}>DATOS PERSONALES Y ADMINISTRATIVOS:</div>
      <table style={{width:"100%",borderCollapse:"collapse",marginBottom:"12px"}}><tbody>
        <tr><td style={th2}>Primer Apellido</td><td style={th2}>Segundo Apellido</td><td style={th2}>Nombres</td></tr>
        <tr><td style={td2}>{primerApellido}</td><td style={td2}>{segundoApellido}</td><td style={td2}>{nombres}</td></tr>
        <tr><td style={th2}>Cargo</td><td style={th2}>Sucursal</td><td style={th2}>Fecha de Ingreso</td></tr>
        <tr><td style={td2}>{s.cargo}</td><td style={td2}>{s.sucursal||""}</td><td style={td2}>{s.fechaIngreso?fmtD(s.fechaIngreso):""}</td></tr>
      </tbody></table>
      <div style={{display:"flex",alignItems:"stretch"}}>
        <div style={{flex:1,...sh,display:"flex",alignItems:"center"}}>SOLICITUD DE {esC?"COMPENSACIÓN":"VACACIONES"}:</div>
        <div style={{border,borderLeft:"none",padding:"6px 12px",fontSize:"12px",backgroundColor:"#f2f2f2",display:"flex",alignItems:"center",gap:"8px",whiteSpace:"nowrap"}}>
          <span style={{fontWeight:"bold"}}>Dias Disponibles</span>
          <span style={{border,backgroundColor:"white",padding:"3px 12px",fontWeight:"bold"}}>{diasDisp!==null?fmtNum(diasDisp):""}</span>
        </div>
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",marginBottom:"12px"}}><tbody>
        <tr>
          <td style={th2}>Periodo</td><td style={th2}>Fecha de Inicio</td><td style={th2}>Fecha de Término</td>
          <td style={th2}>Total Dias Laborales</td><td style={th2}>Fecha de Retorno</td><td style={th2}>Días Pendientes</td>
        </tr>
        <tr>
          <td style={td2}>{s.fechaInicio?s.fechaInicio.slice(0,4):""}</td>
          <td style={td2}>{fmtD(s.fechaInicio)}</td>
          <td style={td2}>{fmtD(s.fechaFin)}</td>
          <td style={td2}>{s.diasEstimados}</td>
          <td style={td2}>{s.fechaRetorno?fmtD(s.fechaRetorno):""}</td>
          <td style={td2}>{diasPendientes!==null?fmtNum(diasPendientes):""}</td>
        </tr>
        <tr><td style={td2}>&nbsp;</td><td style={td2}></td><td style={td2}></td><td style={td2}></td><td style={td2}></td><td style={td2}></td></tr>
        <tr>
          <td colSpan={3} style={{...th2,textAlign:"center"}}>TOTAL</td>
          <td style={td2}>{s.diasEstimados}</td><td style={td2}></td><td style={td2}></td>
        </tr>
      </tbody></table>
      <div style={sh}>ACLARACIONES:</div>
      <div style={{border,borderTop:"none",minHeight:"60px",padding:"10px 12px",fontSize:"13px",marginBottom:"18px",fontFamily:F}}>
        {[
          s.feriadosEnRango?.length>0&&`Feriados excluidos: ${s.feriadosEnRango.map(f=>`${fmtD(f.fecha)} – ${f.desc}`).join(", ")}.`,
          s.cumpleEnRango&&`Cumpleaños en período: ${fmtD(s.cumpleEnRango)} (½ día libre, no descuenta saldo).`,
          esC&&"Compensación por trabajo extraordinario. No afecta el saldo de vacaciones.",
          s.observaciones,
        ].filter(Boolean).join(" ")}
      </div>
      <table style={{width:"100%",borderCollapse:"collapse"}}><tbody>
        <tr><td style={{...th2,width:"50%"}}>FIRMA DEL INTERESADO</td><td style={{...th2,width:"50%"}}>AUTORIZACIÓN PERMISO</td></tr>
        <tr>
          <td style={{border,height:"230px",verticalAlign:"bottom",padding:"6px 12px",fontFamily:F}}>
            <div style={{fontSize:"11px",color:"#555"}}>FECHA DE SOLICITUD: {fmtD(s.fechaSolicitud?.split("T")[0])}</div>
          </td>
          <td style={{border,verticalAlign:"top",padding:"0"}}>
            <div style={{backgroundColor:gray,fontSize:"12px",fontWeight:"bold",padding:"4px 12px",borderBottom:"1px solid #000",fontFamily:F}}>
              JEFE INMEDIATO SUPERIOR{s.jefeNombre?` — ${s.jefeNombre.toUpperCase()}`:""}
            </div>
            <div style={{height:"210px"}}/>
          </td>
        </tr>
      </tbody></table>
      <div style={{marginTop:"18px",fontSize:"10px",color:"#333",fontFamily:F}}>Departamento de RRHH</div>
    </div>
  );
}
