function ciToEmail(ci){
  const clean=(ci||"").trim().replace(/[^a-zA-Z0-9]/g,"").toLowerCase();
  return `ci${clean}@agromel-vacaciones.local`;
}
function esEmailReal(email){
  return !!email && !email.endsWith("@agromel-vacaciones.local");
}
async function resolverEmailPorCi(ci){
  const desdeIndice=await DB.loginIndexGet(ci.trim());
  return desdeIndice || ciToEmail(ci); // compatibilidad con cuentas creadas antes de tener el indice
}

function AuthScreen(){
  const [modo,setModo]=useState("login"); // login | registro | reset
  const [ci,setCi]=useState("");
  const [password,setPassword]=useState("");
  const [correoOpcional,setCorreoOpcional]=useState("");
  const [error,setError]=useState("");
  const [msg,setMsg]=useState("");
  const [loading,setLoading]=useState(false);

  const doLogin=async()=>{
    setError(""); setLoading(true);
    try{
      if(!ci.trim()){ setError("Ingresa tu número de CI."); setLoading(false); return; }
      const email=await resolverEmailPorCi(ci);
      await window.__fbAuth.signInWithEmailAndPassword(email,password);
    }catch(e){ setError("No se pudo iniciar sesión. Revisa tu CI y contraseña."); }
    setLoading(false);
  };

  const doRegistro=async()=>{
    setError(""); setLoading(true);
    let cred=null;
    try{
      if(!ci.trim()){ setError("Ingresa tu número de CI."); setLoading(false); return; }
      if(!password||password.length<6){ setError("La contraseña debe tener al menos 6 caracteres."); setLoading(false); return; }
      const authEmail=correoOpcional.trim()||ciToEmail(ci);
      // Paso 1: crear la cuenta primero (recien ahi quedamos autenticados y podemos leer la base de datos)
      cred=await window.__fbAuth.createUserWithEmailAndPassword(authEmail,password);
      await DB.loginIndexSet(ci.trim(),authEmail);

      // Paso 2: ya autenticados, revisamos si es la primera cuenta del sistema (bootstrap RRHH) o un empleado ya cargado
      const todos=await DB.empGetAll();
      if(todos.length===0){
        await DB.empSave({ci:ci.trim(),nombre:"",cargo:"",area:AREAS[0],sucursal:SUCURSALES[0],fechaIngreso:"",
          codigo:"",diasDisponibles:"0",fechaCorteSaldo:hoyISO(),fechaNacimiento:"",jefeCi:"",esRRHH:true,
          uid:cred.user.uid,email:authEmail});
        setMsg("¡Cuenta creada! Eres la primera persona registrada, así que tienes acceso al Panel RRHH.");
        setLoading(false); return;
      }
      const empExistente=await DB.empGetByCi(ci.trim());
      if(!empExistente){
        await cred.user.delete().catch(()=>{});
        setError("Tu CI no está registrado en el sistema. Pide a RRHH que te agregue primero.");
        setLoading(false); return;
      }
      if(empExistente.uid){
        await cred.user.delete().catch(()=>{});
        setError("Ese CI ya tiene una cuenta creada. Si registraste un correo, usa 'Olvidé mi contraseña'; si no, pide a RRHH que la restablezca.");
        setLoading(false); return;
      }
      await DB.empSave({id:empExistente.id,uid:cred.user.uid,email:authEmail});
      setMsg("¡Cuenta creada correctamente!");
    }catch(e){
      if(cred) await cred.user.delete().catch(()=>{});
      setError(e.code==="auth/email-already-in-use"?"Ya existe una cuenta con ese CI o correo. Intenta iniciar sesión.":
        e.code==="auth/weak-password"?"La contraseña es muy débil, usa al menos 6 caracteres.":
        e.code==="auth/invalid-email"?"El correo ingresado no es válido.":
        "No se pudo crear la cuenta. Intenta de nuevo.");
    }
    setLoading(false);
  };

  const doReset=async()=>{
    setError(""); setMsg(""); setLoading(true);
    try{
      if(!ci.trim()){ setError("Ingresa tu número de CI."); setLoading(false); return; }
      const email=await resolverEmailPorCi(ci);
      if(!esEmailReal(email)){
        setError("No registraste un correo real con esa cuenta. Pide a RRHH que te restablezca la contraseña.");
        setLoading(false); return;
      }
      await window.__fbAuth.sendPasswordResetEmail(email);
      setMsg("Te enviamos un correo para restablecer tu contraseña.");
    }catch(e){ setError("No se pudo enviar el correo. Verifica tu CI."); }
    setLoading(false);
  };

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px"}}>
      <div style={{...CARD,maxWidth:"380px",width:"100%",padding:"32px"}}>
        <div style={{textAlign:"center",marginBottom:"20px"}}>
          <div style={{fontSize:"32px"}}>🏖️</div>
          <h2 style={{margin:"8px 0 2px",fontSize:"18px",fontWeight:"700",color:"#111827"}}>{COMPANY_SHORT}</h2>
          <p style={{margin:0,fontSize:"13px",color:"#9ca3af"}}>Sistema de Vacaciones</p>
        </div>
        {msg&&<div style={{padding:"10px 14px",backgroundColor:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:"8px",color:"#166534",fontSize:"13px",marginBottom:"12px"}}>{msg}</div>}
        {error&&<div style={{padding:"10px 14px",backgroundColor:"#fef2f2",border:"1px solid #fecaca",borderRadius:"8px",color:"#dc2626",fontSize:"13px",marginBottom:"12px"}}>⚠️ {error}</div>}
        <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
          <div><label style={LBL}>N° de Cédula de Identidad</label><input style={INP} value={ci} onChange={e=>setCi(e.target.value)} placeholder="Tu CI, sin espacios"/></div>
          {modo!=="reset"&&<PasswordField label="Contraseña" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Mínimo 6 caracteres"/>}
          {modo==="registro"&&<div><label style={LBL}>Correo electrónico <span style={{color:"#9ca3af",fontWeight:"400"}}>(opcional, solo para recuperar tu contraseña)</span></label><input style={INP} type="email" value={correoOpcional} onChange={e=>setCorreoOpcional(e.target.value)} placeholder="Déjalo vacío si no tienes correo"/></div>}
          {modo==="login"&&<button disabled={loading} onClick={doLogin} style={{...BTN_PRIMARY,width:"100%"}}>{loading?"Ingresando...":"Iniciar sesión"}</button>}
          {modo==="registro"&&<button disabled={loading} onClick={doRegistro} style={{...BTN_PRIMARY,width:"100%"}}>{loading?"Creando cuenta...":"Crear cuenta"}</button>}
          {modo==="reset"&&<button disabled={loading} onClick={doReset} style={{...BTN_PRIMARY,width:"100%"}}>{loading?"Enviando...":"Enviar enlace de recuperación"}</button>}
        </div>
        <div style={{marginTop:"16px",display:"flex",justifyContent:"space-between",fontSize:"12px"}}>
          {modo!=="login"&&<button onClick={()=>{setModo("login");setError("");setMsg("");}} style={{background:"none",border:"none",color:COLOR_RED,cursor:"pointer",fontSize:"12px"}}>← Iniciar sesión</button>}
          {modo==="login"&&<button onClick={()=>{setModo("registro");setError("");setMsg("");}} style={{background:"none",border:"none",color:COLOR_RED,cursor:"pointer",fontSize:"12px"}}>Crear cuenta nueva</button>}
          {modo==="login"&&<button onClick={()=>{setModo("reset");setError("");setMsg("");}} style={{background:"none",border:"none",color:"#6b7280",cursor:"pointer",fontSize:"12px"}}>Olvidé mi contraseña</button>}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// VISTA: SOLICITAR VACACIONES (cualquier usuario, incluso jefes)
// ============================================================
function SolicitarView({miEmpleado, sols, recargar}){
  const [step,setStep]=useState("form");
  const [solGuardada,setSolGuardada]=useState(null);
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState("");
  const [feriadosVar,setFeriadosVar]=useState([]);
  const [form,setForm]=useState({
    tipo:"VACACION",modalidad:"DIA_COMPLETO",horasPorDia:"1",
    fechaInicio:"",fechaFin:"",fechaRetorno:"",observaciones:""
  });
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));

  useEffect(()=>{
    const yr=new Date().getFullYear();
    Promise.all([DB.ferGet(yr),DB.ferGet(yr+1)]).then(([a,b])=>setFeriadosVar([...a,...b]));
  },[]);

  const calcResult=useMemo(()=>calcDias(form.fechaInicio,form.fechaFin,form.modalidad,form.horasPorDia,feriadosVar,miEmpleado.fechaNacimiento||null,miEmpleado.horarioSemana||"L-V"),
    [form.fechaInicio,form.fechaFin,form.modalidad,form.horasPorDia,feriadosVar,miEmpleado.fechaNacimiento,miEmpleado.horarioSemana]);

  const saldoActual=useMemo(()=>calcSaldoActual(miEmpleado,sols),[miEmpleado,sols]);

  const validar=()=>{
    if(!form.fechaInicio) return "Selecciona la fecha de inicio.";
    if(!form.fechaFin) return "Selecciona la fecha de fin.";
    if(form.fechaFin<form.fechaInicio) return "La fecha fin no puede ser menor a la fecha inicio.";
    if(form.modalidad==="HORA"&&!(parseFloat(form.horasPorDia)>0)) return "Ingresa las horas por día.";
    return "";
  };

  const generar=async()=>{
    const err=validar(); if(err){setError(err);return;}
    setError(""); setSaving(true);
    try{
      const jefe=miEmpleado.jefeCi?await DB.empGetByCi(miEmpleado.jefeCi):null;
      const nueva={
        numero:genNum(), empleadoCi:miEmpleado.ci, nombreEmpleado:miEmpleado.nombre, ci:miEmpleado.ci,
        cargo:miEmpleado.cargo, area:miEmpleado.area, sucursal:miEmpleado.sucursal||"", fechaIngreso:miEmpleado.fechaIngreso||"",
        codigo:miEmpleado.codigo||"", diasDisponibles:String(saldoActual),
        tipo:form.tipo, modalidad:form.modalidad, horasPorDia:form.horasPorDia,
        fechaInicio:form.fechaInicio, fechaFin:form.fechaFin, fechaRetorno:form.fechaRetorno,
        observaciones:form.observaciones, diasEstimados:calcResult.dias,
        feriadosEnRango:calcResult.feriadosEnRango, cumpleEnRango:calcResult.cumpleEnRango,
        estado:"Pendiente", jefeCi:miEmpleado.jefeCi||"", jefeNombre:jefe?jefe.nombre:"",
        fechaSolicitud:new Date().toISOString(),
      };
      const id=await DB.solCreate(nueva);
      setSolGuardada({...nueva,id}); setStep("preview");
      recargar();
    }catch(e){ setError("No se pudo guardar la solicitud. Intenta de nuevo."); }
    setSaving(false);
  };

  if(step==="preview"&&solGuardada) return(
    <div>
      <div className="print-hidden" style={{display:"flex",gap:"10px",marginBottom:"14px",flexWrap:"wrap"}}>
        <button onClick={()=>window.print()} style={BTN_PRIMARY}>🖨️ Imprimir formulario</button>
        <button onClick={()=>{setStep("form");setSolGuardada(null);setForm({tipo:"VACACION",modalidad:"DIA_COMPLETO",horasPorDia:"1",fechaInicio:"",fechaFin:"",fechaRetorno:"",observaciones:""});}} style={BTN_SECONDARY}>Nueva solicitud</button>
      </div>
      <div className="print-hidden" style={{marginBottom:"12px",padding:"10px 14px",backgroundColor:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:"8px",color:"#166534",fontSize:"13px"}}>
        ✅ Solicitud enviada{solGuardada.jefeNombre?` a ${solGuardada.jefeNombre} para su aprobación`:""}. Imprime el formulario y entrégalo firmado a RRHH.
      </div>
      <PrintForm s={solGuardada}/>
    </div>
  );

  const {dias:diasCalc,feriadosEnRango:fers,cumpleEnRango:cumple}=calcResult;
  return(
    <div style={{maxWidth:"640px",margin:"0 auto"}}>
      <div style={CARD}>
        <div style={{backgroundColor:COLOR_DARK,color:"white",padding:"20px 24px"}}>
          <h2 style={{margin:0,fontSize:"18px",fontWeight:"700"}}>Nueva Solicitud</h2>
          <p style={{margin:"4px 0 0",fontSize:"13px",color:"#93c5fd"}}>{miEmpleado.nombre} — {miEmpleado.cargo}</p>
        </div>
        <div style={{padding:"24px",display:"flex",flexDirection:"column",gap:"20px"}}>
          <div style={{padding:"10px 14px",backgroundColor:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:"8px",fontSize:"13px",color:"#1e40af"}}>
            🏖️ Tu saldo actual disponible: <strong>{saldoActual} día(s)</strong>
            {miEmpleado.jefeCi&&<div style={{marginTop:"2px"}}>Tu solicitud será enviada a tu jefe inmediato para aprobación.</div>}
            {!miEmpleado.jefeCi&&<div style={{marginTop:"2px",color:"#92400e"}}>⚠️ No tienes un jefe asignado. Pide a RRHH que lo configure.</div>}
          </div>
          <div>
            <div style={LBL}>Tipo de solicitud</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}}>
              {Object.entries(TIPO_CFG).map(([v,t])=>(
                <button key={v} onClick={()=>set("tipo",v)} style={{padding:"12px",borderRadius:"10px",border:`2px solid ${form.tipo===v?COLOR_RED:"#e5e7eb"}`,backgroundColor:form.tipo===v?"#fef2f2":"white",cursor:"pointer",textAlign:"left"}}>
                  <div style={{fontSize:"22px"}}>{t.icon}</div>
                  <div style={{fontWeight:"700",fontSize:"13px",color:form.tipo===v?COLOR_RED:"#374151",marginTop:"4px"}}>{t.label}</div>
                  <div style={{fontSize:"11px",color:"#9ca3af"}}>{t.sub}</div>
                </button>
              ))}
            </div>
          </div>
          <div>
            <div style={LBL}>Período solicitado</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
              <div><label style={LBL}>Fecha inicio *</label><input type="date" style={INP} value={form.fechaInicio} onChange={e=>set("fechaInicio",e.target.value)}/></div>
              <div><label style={LBL}>Fecha fin *</label><input type="date" style={INP} value={form.fechaFin} min={form.fechaInicio} onChange={e=>set("fechaFin",e.target.value)}/></div>
              <div><label style={LBL}>Fecha retorno (opcional)</label><input type="date" style={INP} value={form.fechaRetorno} onChange={e=>set("fechaRetorno",e.target.value)}/></div>
              <div><label style={LBL}>Días hábiles estimados</label><div style={{...INP,backgroundColor:"#f9fafb",color:diasCalc>0?COLOR_RED:"#9ca3af",fontWeight:"600"}}>{diasCalc>0?`${diasCalc} día(s)`:"—"}</div></div>
            </div>
            {(fers.length>0||cumple)&&(
              <div style={{marginTop:"10px",display:"flex",flexDirection:"column",gap:"6px"}}>
                {fers.length>0&&<div style={{padding:"8px 12px",backgroundColor:"#fff7ed",border:"1px solid #fed7aa",borderRadius:"8px",fontSize:"12px",color:"#9a3412"}}><strong>🏳️ Feriados excluidos:</strong> {fers.map(f=>`${fmtD(f.fecha)} (${f.desc})`).join(", ")}</div>}
                {cumple&&<div style={{padding:"8px 12px",backgroundColor:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:"8px",fontSize:"12px",color:"#166534"}}>🎉 Cumpleaños el {fmtD(cumple)} — ½ día libre sin descontar.</div>}
              </div>
            )}
            {form.tipo==="VACACION"&&diasCalc>saldoActual&&(
              <div style={{marginTop:"10px",padding:"8px 12px",backgroundColor:"#fef2f2",border:"1px solid #fecaca",borderRadius:"8px",fontSize:"12px",color:"#dc2626"}}>
                ⚠️ Estás solicitando {diasCalc} día(s), pero tu saldo disponible es de {saldoActual} día(s). Igual puedes enviarla, pero tu jefe verá esta misma advertencia al revisarla.
              </div>
            )}
          </div>
          <div>
            <label style={LBL}>Modalidad</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
              {MODALIDADES.map(m=>(
                <button key={m.value} onClick={()=>set("modalidad",m.value)} style={{padding:"9px 12px",borderRadius:"8px",border:`1.5px solid ${form.modalidad===m.value?COLOR_RED:"#e5e7eb"}`,backgroundColor:form.modalidad===m.value?"#fef2f2":"white",color:form.modalidad===m.value?COLOR_RED:"#6b7280",fontWeight:form.modalidad===m.value?"700":"400",cursor:"pointer",fontSize:"13px"}}>{m.label}</button>
              ))}
            </div>
            {form.modalidad==="HORA"&&<div style={{marginTop:"10px",display:"flex",alignItems:"center",gap:"10px"}}>
              <label style={{...LBL,margin:0}}>Horas por día *</label>
              <input type="number" min="0.5" max="8" step="0.5" style={{...INP,width:"80px"}} value={form.horasPorDia} onChange={e=>set("horasPorDia",e.target.value)}/>
            </div>}
          </div>
          <div><label style={LBL}>Observaciones (opcional)</label><textarea style={{...INP,minHeight:"70px",resize:"vertical"}} value={form.observaciones} onChange={e=>set("observaciones",e.target.value)}/></div>
          {error&&<div style={{padding:"10px 14px",backgroundColor:"#fef2f2",border:"1px solid #fecaca",borderRadius:"8px",color:"#dc2626",fontSize:"13px"}}>⚠️ {error}</div>}
          <button onClick={generar} disabled={saving} style={{...BTN_PRIMARY,width:"100%",padding:"13px",fontSize:"15px",opacity:saving?0.6:1}}>{saving?"Generando...":"✅ Generar y enviar formulario"}</button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// VISTA: MIS SOLICITUDES (cualquier usuario, ve y cancela las propias)
// ============================================================
function MisSolicitudesView({miEmpleado, sols, recargar}){
  const [sel,setSel]=useState(null);
  const [showPrint,setShowPrint]=useState(false);
  const [confirmDel,setConfirmDel]=useState(false);
  const misSolicitudes=sols.filter(s=>s.ci===miEmpleado.ci).sort((a,b)=>(b.fechaSolicitud||"").localeCompare(a.fechaSolicitud||""));

  const eliminar=async s=>{
    await DB.solDelete(s.id);
    setConfirmDel(false); setSel(null);
    recargar();
  };

  if(!misSolicitudes.length) return <div style={{textAlign:"center",padding:"40px",color:"#9ca3af"}}><div style={{fontSize:"36px",marginBottom:"8px"}}>📭</div><p>Todavía no has generado ninguna solicitud.</p></div>;

  if(showPrint&&sel) return(
    <div>
      <button onClick={()=>setShowPrint(false)} className="print-hidden" style={{marginBottom:"12px",color:COLOR_RED,background:"none",border:"none",cursor:"pointer",fontSize:"14px"}}>← Volver</button>
      <div className="print-hidden" style={{marginBottom:"12px"}}>
        <button onClick={()=>window.print()} style={BTN_PRIMARY}>🖨️ Imprimir</button>
      </div>
      <PrintForm s={sel}/>
    </div>
  );

  if(sel){
    const c=EC[sel.estado]||EC.Pendiente;
    return(
      <div>
        <button onClick={()=>{setSel(null);setConfirmDel(false);}} style={{marginBottom:"12px",color:COLOR_RED,background:"none",border:"none",cursor:"pointer",fontSize:"14px"}}>← Lista</button>
        <div style={CARD}>
          <div style={{backgroundColor:COLOR_DARK,color:"white",padding:"20px 24px",display:"flex",justifyContent:"space-between"}}>
            <div><h3 style={{margin:0,fontSize:"16px"}}>Solicitud N° {sel.numero}</h3><p style={{margin:"3px 0 0",color:"#93c5fd",fontSize:"13px"}}>{fmtD(sel.fechaInicio)} → {fmtD(sel.fechaFin)}</p></div>
            <span style={{backgroundColor:c.bg,color:c.text,border:`1px solid ${c.border}`,padding:"4px 10px",borderRadius:"20px",fontSize:"12px",fontWeight:"600",height:"fit-content"}}>{sel.estado}</span>
          </div>
          <div style={{padding:"20px 24px"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",fontSize:"13px"}}>
              {[["Tipo",sel.tipo],["Modalidad",fmtMd(sel.modalidad,sel.horasPorDia)],["Días",`${sel.diasEstimados} día(s)`],["Jefe",sel.jefeNombre||"—"]].map(([k,v])=>(
                <div key={k}><div style={{color:"#9ca3af",fontSize:"11px"}}>{k}</div><div style={{fontWeight:"600",color:"#1f2937"}}>{v}</div></div>
              ))}
              {sel.observaciones&&<div style={{gridColumn:"1/-1"}}><div style={{color:"#9ca3af",fontSize:"11px"}}>Observaciones</div><div style={{backgroundColor:"#f9fafb",padding:"8px",borderRadius:"6px"}}>{sel.observaciones}</div></div>}
            </div>
            <div style={{display:"flex",gap:"8px",marginTop:"20px",flexWrap:"wrap"}}>
              <button onClick={()=>setShowPrint(true)} style={BTN_SECONDARY}>🖨️ Ver / Imprimir formulario</button>
              {sel.estado==="Pendiente"&&!confirmDel&&<button onClick={()=>setConfirmDel(true)} style={{...BTN_SECONDARY,color:"#dc2626",borderColor:"#fecaca"}}>🗑️ Eliminar solicitud</button>}
              {confirmDel&&<>
                <span style={{fontSize:"13px",color:"#dc2626",fontWeight:"600",alignSelf:"center"}}>¿Seguro que quieres eliminarla?</span>
                <button onClick={()=>eliminar(sel)} style={{...BTN_PRIMARY,backgroundColor:"#dc2626"}}>Sí, eliminar</button>
                <button onClick={()=>setConfirmDel(false)} style={BTN_SECONDARY}>Cancelar</button>
              </>}
            </div>
            {sel.estado!=="Pendiente"&&<p style={{fontSize:"12px",color:"#9ca3af",marginTop:"10px"}}>Ya no se puede eliminar: esta solicitud ya fue {sel.estado==="Aprobada"?"aprobada":"rechazada"}.</p>}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div>
      <div style={{fontSize:"16px",fontWeight:"700",marginBottom:"14px"}}>Mis solicitudes</div>
      <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
        {misSolicitudes.map(s=>{
          const c=EC[s.estado]||EC.Pendiente;
          return(
            <div key={s.id} onClick={()=>setSel(s)} style={{...CARD,padding:"14px 18px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:"600",fontSize:"14px"}}>N° {s.numero}</div>
                <div style={{color:"#9ca3af",fontSize:"12px",marginTop:"3px"}}>📅 {fmtD(s.fechaInicio)} → {fmtD(s.fechaFin)} · {s.diasEstimados} día(s)</div>
              </div>
              <span style={{backgroundColor:c.bg,color:c.text,border:`1px solid ${c.border}`,padding:"4px 10px",borderRadius:"20px",fontSize:"11px",fontWeight:"600"}}>{s.estado}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// VISTA: APROBACIONES (para jefes)
// ============================================================
function AprobacionesView({miEmpleado, sols, recargar}){
  const [sel,setSel]=useState(null);
  const misSolicitudes=sols.filter(s=>s.jefeCi===miEmpleado.ci);

  const cambiarEstado=async(s,est)=>{
    await DB.solUpdate(s.id,{estado:est,fechaResolucion:new Date().toISOString(),resolvedByCi:miEmpleado.ci});
    recargar(); setSel(null);
  };

  if(!misSolicitudes.length) return <div style={{textAlign:"center",padding:"40px",color:"#9ca3af"}}><div style={{fontSize:"36px",marginBottom:"8px"}}>📭</div><p>No tienes solicitudes de tu equipo por revisar.</p></div>;

  if(sel){
    const c=EC[sel.estado]||EC.Pendiente;
    return(
      <div>
        <button onClick={()=>setSel(null)} style={{marginBottom:"12px",color:COLOR_RED,background:"none",border:"none",cursor:"pointer",fontSize:"14px"}}>← Lista</button>
        <div style={CARD}>
          <div style={{backgroundColor:COLOR_DARK,color:"white",padding:"20px 24px",display:"flex",justifyContent:"space-between"}}>
            <div><h3 style={{margin:0,fontSize:"16px"}}>{sel.nombreEmpleado}</h3><p style={{margin:"3px 0 0",color:"#93c5fd",fontSize:"13px"}}>{sel.cargo}</p></div>
            <span style={{backgroundColor:c.bg,color:c.text,border:`1px solid ${c.border}`,padding:"4px 10px",borderRadius:"20px",fontSize:"12px",fontWeight:"600",height:"fit-content"}}>{sel.estado}</span>
          </div>
          <div style={{padding:"20px 24px"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",fontSize:"13px"}}>
              {[["Tipo",sel.tipo],["Modalidad",fmtMd(sel.modalidad,sel.horasPorDia)],["Fecha inicio",fmtD(sel.fechaInicio)],["Fecha fin",fmtD(sel.fechaFin)],["Días",`${sel.diasEstimados} día(s)`],["Saldo al solicitar",sel.diasDisponibles]].map(([k,v])=>(
                <div key={k}><div style={{color:"#9ca3af",fontSize:"11px"}}>{k}</div><div style={{fontWeight:"600",color:"#1f2937"}}>{v}</div></div>
              ))}
              {sel.observaciones&&<div style={{gridColumn:"1/-1"}}><div style={{color:"#9ca3af",fontSize:"11px"}}>Observaciones</div><div style={{backgroundColor:"#f9fafb",padding:"8px",borderRadius:"6px"}}>{sel.observaciones}</div></div>}
            </div>
            {sel.tipo==="VACACION"&&parseFloat(sel.diasEstimados)>parseFloat(sel.diasDisponibles||0)&&(
              <div style={{marginTop:"14px",padding:"10px 14px",backgroundColor:"#fef2f2",border:"1px solid #fecaca",borderRadius:"8px",fontSize:"13px",color:"#dc2626"}}>
                ⚠️ Esta solicitud pide más días ({sel.diasEstimados}) de los que tenía disponibles al momento de solicitar ({sel.diasDisponibles}).
              </div>
            )}
            {sel.estado==="Pendiente"&&<div style={{display:"flex",gap:"8px",marginTop:"20px"}}>
              <button onClick={()=>cambiarEstado(sel,"Aprobada")} style={{...BTN_PRIMARY,backgroundColor:"#16a34a"}}>✅ Aprobar</button>
              <button onClick={()=>cambiarEstado(sel,"Rechazada")} style={{...BTN_PRIMARY,backgroundColor:"#dc2626"}}>❌ Rechazar</button>
            </div>}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div>
      <div style={{fontSize:"16px",fontWeight:"700",marginBottom:"14px"}}>Solicitudes de mi equipo</div>
      <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
        {misSolicitudes.map(s=>{
          const c=EC[s.estado]||EC.Pendiente;
          return(
            <div key={s.id} onClick={()=>setSel(s)} style={{...CARD,padding:"14px 18px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:"600",fontSize:"14px"}}>{s.nombreEmpleado}</div>
                <div style={{color:"#9ca3af",fontSize:"12px",marginTop:"3px"}}>📅 {fmtD(s.fechaInicio)} → {fmtD(s.fechaFin)} · {s.diasEstimados} día(s)</div>
              </div>
              <span style={{backgroundColor:c.bg,color:c.text,border:`1px solid ${c.border}`,padding:"4px 10px",borderRadius:"20px",fontSize:"11px",fontWeight:"600"}}>{s.estado}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// PANEL RRHH — EMPLEADOS
// ============================================================
function RRHHEmpleados({emps, sols, recargar}){
  const DEFAULT_EMP={id:"",nombre:"",ci:"",cargo:"",area:AREAS[0],sucursal:SUCURSALES[0],fechaIngreso:"",codigo:"",diasDisponibles:"",fechaCorteSaldo:"",fechaNacimiento:"",jefeCi:"",esRRHH:false,cuentaAdmin:false,horarioSemana:"L-V"};
  const [form,setForm]=useState(DEFAULT_EMP);
  const [editing,setEditing]=useState(false);
  const [msg,setMsg]=useState("");
  const [importText,setImportText]=useState("");
  const [showImport,setShowImport]=useState(false);
  const [confirmDelId,setConfirmDelId]=useState("");
  const [busqueda,setBusqueda]=useState("");
  const [filtroArea,setFiltroArea]=useState("");
  const [filtroSucursal,setFiltroSucursal]=useState("");
  const [ordenarPor,setOrdenarPor]=useState("nombre"); // nombre | ci | codigo | area | sucursal | fechaIngreso | saldo
  const [ordenDesc,setOrdenDesc]=useState(false);
  const setF=(k,v)=>setForm(p=>({...p,[k]:v}));

  const b=busqueda.trim().toLowerCase();
  const areasUsadas=[...new Set(emps.map(e=>e.area).filter(Boolean))].sort();
  const sucursalesUsadas=[...new Set(emps.map(e=>e.sucursal).filter(Boolean))].sort();

  const empsFiltrados=emps
    .filter(e=>!b||[e.nombre,e.ci,e.cargo,e.area,e.sucursal,e.codigo].filter(Boolean).some(v=>String(v).toLowerCase().includes(b)))
    .filter(e=>!filtroArea||e.area===filtroArea)
    .filter(e=>!filtroSucursal||e.sucursal===filtroSucursal)
    .sort((a,b2)=>{
      let va,vb;
      if(ordenarPor==="saldo"){ va=calcSaldoActual(a,sols); vb=calcSaldoActual(b2,sols); }
      else if(ordenarPor==="codigo"){ va=parseFloat(a.codigo)||0; vb=parseFloat(b2.codigo)||0; }
      else { va=(a[ordenarPor]||"").toString().toLowerCase(); vb=(b2[ordenarPor]||"").toString().toLowerCase(); }
      const cmp=va<vb?-1:va>vb?1:0;
      return ordenDesc?-cmp:cmp;
    });

  const guardar=async()=>{
    if(!form.nombre.trim()){setMsg("⚠️ El nombre es obligatorio.");return;}
    const nuevo={...form,fechaCorteSaldo:hoyISO()};
    await DB.empSave(nuevo);
    if(nuevo.uid) await DB.roleSet(nuevo.uid,nuevo.esRRHH);
    setForm(DEFAULT_EMP); setEditing(false);
    setMsg("✅ Empleado guardado."); setTimeout(()=>setMsg(""),3000);
    recargar();
  };
  const editar=e=>{
    const saldoHoy=calcSaldoActual(e,sols);
    setForm({...DEFAULT_EMP,...e,diasDisponibles:String(saldoHoy)});
    setEditing(true);
  };
  const eliminar=async id=>{
    await DB.empDelete(id); setConfirmDelId("");
    setMsg("🗑️ Empleado eliminado."); setTimeout(()=>setMsg(""),3000);
    recargar();
  };
  const importarCSV=async()=>{
    const lineas=importText.trim().split("\n").filter(l=>l.trim());
    if(!lineas.length){setMsg("⚠️ El texto está vacío.");return;}
    let inicio=0;
    if(lineas[0].toLowerCase().replace(/"/g,"").trim().startsWith("nombre")) inicio=1;
    let creados=0, actualizados=0;
    for(let i=inicio;i<lineas.length;i++){
      const cols=lineas[i].split(",").map(c=>c.trim().replace(/"/g,""));
      if(!cols[0]) continue;
      const ci=cols[1]||"";
      const datosNuevo={nombre:cols[0]||"",ci,cargo:cols[2]||"",area:cols[3]||"",fechaNacimiento:cols[4]||"",
        sucursal:cols[5]||"",fechaIngreso:cols[6]||"",codigo:cols[7]||"",diasDisponibles:cols[8]||"",horarioSemana:cols[9]||""};
      const existente=ci?emps.find(x=>x.ci===ci):null;
      if(existente){
        const merged={};
        Object.keys(datosNuevo).forEach(k=>{ if(datosNuevo[k]!=="") merged[k]=datosNuevo[k]; });
        if(datosNuevo.diasDisponibles!=="") merged.fechaCorteSaldo=hoyISO();
        await DB.empSave({id:existente.id,...merged}); actualizados++;
      } else {
        await DB.empSave({area:AREAS[0],sucursal:SUCURSALES[0],fechaCorteSaldo:hoyISO(),jefeCi:"",esRRHH:false,cuentaAdmin:false,horarioSemana:"L-V",...datosNuevo}); creados++;
      }
    }
    setImportText(""); setShowImport(false);
    setMsg(`✅ ${creados} nuevo(s), ${actualizados} actualizado(s).`); setTimeout(()=>setMsg(""),5000);
    recargar();
  };

  const exportarCSV=()=>{
    const esc=v=>{
      const s=(v===undefined||v===null)?"":String(v);
      return s.includes(",")||s.includes('"')||s.includes("\n") ? `"${s.replace(/"/g,'""')}"` : s;
    };
    const filas=[["NombreCompleto","CI","Cargo","Area","FechaNacimiento","Sucursal","FechaIngreso","Codigo","DiasDisponibles","HorarioSemana","JefeCI","EsRRHH"]];
    emps.forEach(e=>{
      filas.push([e.nombre,e.ci,e.cargo,e.area,e.fechaNacimiento,e.sucursal,e.fechaIngreso,e.codigo,
        calcSaldoActual(e,sols),e.horarioSemana||"L-V",e.jefeCi||"",e.esRRHH?"SI":"NO"]);
    });
    const csv=filas.map(f=>f.map(esc).join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`empleados_agromel_${hoyISO()}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const I={...INP,fontSize:"13px",padding:"8px 12px"};
  const L={...LBL,fontSize:"12px",marginBottom:"4px"};
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px",flexWrap:"wrap",gap:"8px"}}>
        <div style={{fontSize:"16px",fontWeight:"700"}}>Empleados ({empsFiltrados.length}{b?` de ${emps.length}`:""})</div>
        <div style={{display:"flex",gap:"8px"}}>
          <button onClick={exportarCSV} style={BTN_SECONDARY}>💾 Exportar CSV</button>
          <button onClick={()=>setShowImport(p=>!p)} style={BTN_SECONDARY}>📂 Importar CSV</button>
          <button onClick={()=>{setEditing(true);setForm(DEFAULT_EMP);}} style={BTN_PRIMARY}>+ Agregar</button>
        </div>
      </div>
      <input value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="🔍 Buscar por nombre, CI, cargo, área, sucursal o código..." style={{...INP,marginBottom:"10px"}}/>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"16px",alignItems:"center"}}>
        <select value={filtroArea} onChange={e=>setFiltroArea(e.target.value)} style={{...INP,width:"auto",fontSize:"13px",padding:"7px 10px"}}>
          <option value="">Todas las áreas</option>
          {areasUsadas.map(a=><option key={a} value={a}>{a}</option>)}
        </select>
        <select value={filtroSucursal} onChange={e=>setFiltroSucursal(e.target.value)} style={{...INP,width:"auto",fontSize:"13px",padding:"7px 10px"}}>
          <option value="">Todas las sucursales</option>
          {sucursalesUsadas.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <span style={{fontSize:"12px",color:"#9ca3af"}}>Ordenar por:</span>
        <select value={ordenarPor} onChange={e=>setOrdenarPor(e.target.value)} style={{...INP,width:"auto",fontSize:"13px",padding:"7px 10px"}}>
          <option value="nombre">Nombre</option>
          <option value="ci">CI</option>
          <option value="codigo">Código</option>
          <option value="area">Área</option>
          <option value="sucursal">Sucursal</option>
          <option value="fechaIngreso">Fecha de ingreso</option>
          <option value="saldo">Saldo actual</option>
        </select>
        <button onClick={()=>setOrdenDesc(d=>!d)} style={{...BTN_SECONDARY,padding:"7px 12px",fontSize:"13px"}}>{ordenDesc?"↓ Descendente":"↑ Ascendente"}</button>
        {(filtroArea||filtroSucursal||busqueda)&&<button onClick={()=>{setFiltroArea("");setFiltroSucursal("");setBusqueda("");}} style={{...BTN_SECONDARY,padding:"7px 12px",fontSize:"13px",color:COLOR_RED}}>✕ Limpiar filtros</button>}
      </div>
      {msg&&<div style={{marginBottom:"12px",padding:"10px 14px",backgroundColor:msg.startsWith("⚠️")?"#fef2f2":"#f0fdf4",border:`1px solid ${msg.startsWith("⚠️")?"#fecaca":"#bbf7d0"}`,borderRadius:"8px",color:msg.startsWith("⚠️")?"#dc2626":"#166534",fontSize:"13px"}}>{msg}</div>}
      {showImport&&(
        <div style={{marginBottom:"16px",padding:"16px",backgroundColor:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:"10px"}}>
          <div style={{fontSize:"12px",color:"#6b7280",marginBottom:"8px"}}>
            Formato: <code style={{backgroundColor:"#e5e7eb",padding:"1px 6px",borderRadius:"4px"}}>NombreCompleto, CI, Cargo, Area, FechaNacimiento, Sucursal, FechaIngreso, Codigo, DiasDisponibles</code>
          </div>
          <textarea value={importText} onChange={e=>setImportText(e.target.value)} style={{width:"100%",height:"120px",border:"1.5px solid #d1d5db",borderRadius:"8px",padding:"8px 12px",fontSize:"12px",fontFamily:"monospace",boxSizing:"border-box"}}/>
          <div style={{display:"flex",gap:"8px",marginTop:"8px"}}>
            <button onClick={importarCSV} style={BTN_PRIMARY}>Importar</button>
            <button onClick={()=>{setShowImport(false);setImportText("");}} style={BTN_SECONDARY}>Cancelar</button>
          </div>
        </div>
      )}
      {editing&&(
        <div style={{marginBottom:"16px",padding:"16px",backgroundColor:"#f9fafb",border:`1.5px solid ${COLOR_RED}`,borderRadius:"10px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:COLOR_RED,marginBottom:"12px"}}>{form.id?"Editar empleado":"Nuevo empleado"}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}}>
            <div style={{gridColumn:"1/-1"}}><label style={L}>Nombre completo *</label><input style={I} value={form.nombre} onChange={e=>setF("nombre",e.target.value)}/></div>
            <div><label style={L}>CI</label><input style={I} value={form.ci} onChange={e=>setF("ci",e.target.value)}/></div>
            <div><label style={L}>Fecha de nacimiento</label><input type="date" style={I} value={form.fechaNacimiento} onChange={e=>setF("fechaNacimiento",e.target.value)}/></div>
            <div><label style={L}>Cargo</label><input style={I} value={form.cargo} onChange={e=>setF("cargo",e.target.value)}/></div>
            <div><label style={L}>Área</label><select style={I} value={form.area} onChange={e=>setF("area",e.target.value)}>{AREAS.map(a=><option key={a}>{a}</option>)}</select></div>
            <div><label style={L}>Sucursal</label><select style={I} value={form.sucursal} onChange={e=>setF("sucursal",e.target.value)}>{SUCURSALES.map(a=><option key={a}>{a}</option>)}</select></div>
            <div><label style={L}>Fecha de ingreso</label><input type="date" style={I} value={form.fechaIngreso} onChange={e=>setF("fechaIngreso",e.target.value)}/></div>
            <div><label style={L}>Código</label><input style={I} value={form.codigo} onChange={e=>setF("codigo",e.target.value)}/></div>
            <div>
              <label style={L}>Horario semanal</label>
              <select style={I} value={form.horarioSemana||"L-V"} onChange={e=>setF("horarioSemana",e.target.value)}>
                <option value="L-V">Lunes a Viernes (sáb. y dom. libres)</option>
                <option value="L-S">Lunes a Sábado (solo dom. libre)</option>
              </select>
            </div>
            <div>
              <label style={L}>Jefe inmediato</label>
              <select style={I} value={form.jefeCi} onChange={e=>setF("jefeCi",e.target.value)}>
                <option value="">— Sin jefe asignado —</option>
                {emps.filter(x=>x.ci!==form.ci&&!x.cuentaAdmin).map(x=><option key={x.id} value={x.ci}>{x.nombre} ({x.cargo})</option>)}
              </select>
            </div>
            <div style={{gridColumn:"1/-1"}}>
              <label style={L}>Días disponibles (saldo a hoy)</label>
              <input type="number" step="0.5" style={I} value={form.diasDisponibles} onChange={e=>setF("diasDisponibles",e.target.value)}/>
              {form.fechaIngreso&&<div style={{marginTop:"4px",fontSize:"11px",color:"#6b7280",display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap"}}>
                <span>Antigüedad: {calcAntiguedadTxt(form.fechaIngreso)}. Acumulado según Ley desde ingreso: <strong>{calcDiasAcumulados(form.fechaIngreso)}</strong> día(s).</span>
                <button type="button" onClick={()=>setF("diasDisponibles",String(calcDiasAcumulados(form.fechaIngreso)))} style={{padding:"2px 8px",borderRadius:"6px",border:`1px solid ${COLOR_RED}`,backgroundColor:"white",color:COLOR_RED,cursor:"pointer",fontSize:"11px"}}>Usar este valor</button>
              </div>}
            </div>
            <div style={{gridColumn:"1/-1",display:"flex",alignItems:"center",gap:"8px"}}>
              <input type="checkbox" id="esRRHH" checked={!!form.esRRHH} onChange={e=>setF("esRRHH",e.target.checked)}/>
              <label htmlFor="esRRHH" style={{fontSize:"13px",color:"#374151"}}>Tiene acceso al Panel RRHH</label>
            </div>
            <div style={{gridColumn:"1/-1",display:"flex",alignItems:"center",gap:"8px"}}>
              <input type="checkbox" id="cuentaAdmin" checked={!!form.cuentaAdmin} onChange={e=>setF("cuentaAdmin",e.target.checked)}/>
              <label htmlFor="cuentaAdmin" style={{fontSize:"13px",color:"#374151"}}>Cuenta administrativa (sin vacaciones — no aparece "Solicitar")</label>
            </div>
          </div>
          <div style={{display:"flex",gap:"8px",marginTop:"12px"}}>
            <button onClick={guardar} style={BTN_PRIMARY}>💾 Guardar</button>
            <button onClick={()=>{setEditing(false);setForm(DEFAULT_EMP);}} style={BTN_SECONDARY}>Cancelar</button>
          </div>
        </div>
      )}
      {empsFiltrados.length===0?<div style={{textAlign:"center",padding:"40px",color:"#9ca3af"}}>{emps.length===0?"No hay empleados aún.":"No se encontraron empleados con esa búsqueda."}</div>:
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {empsFiltrados.map(e=>(
          <div key={e.id} style={{backgroundColor:"white",borderRadius:"8px",padding:"12px 16px",border:"1px solid #e5e7eb",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontWeight:"600",fontSize:"14px"}}>{e.nombre} {e.esRRHH&&<span style={{fontSize:"10px",backgroundColor:"#eff6ff",color:"#1e40af",padding:"1px 6px",borderRadius:"8px",marginLeft:"6px"}}>RRHH</span>} {e.cuentaAdmin&&<span style={{fontSize:"10px",backgroundColor:"#fdf4ff",color:"#86198f",padding:"1px 6px",borderRadius:"8px",marginLeft:"6px"}}>CUENTA ADMIN (sin vacaciones)</span>}</div>
              <div style={{fontSize:"12px",color:"#9ca3af",marginTop:"2px"}}>
                {[e.ci&&`CI: ${e.ci}`,e.cargo,e.area,e.sucursal,e.uid?"✅ cuenta creada":"⏳ sin cuenta"].filter(Boolean).join(" · ")}
              </div>
              {e.fechaIngreso&&<div style={{fontSize:"11px",color:COLOR_RED,fontWeight:"600",marginTop:"2px"}}>🏖️ Saldo actual: {calcSaldoActual(e,sols)} día(s)</div>}
            </div>
            <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
              {confirmDelId===e.id?(
                <>
                  <span style={{fontSize:"12px",color:"#dc2626",fontWeight:"600"}}>¿Eliminar?</span>
                  <button onClick={()=>eliminar(e.id)} style={{padding:"5px 10px",borderRadius:"6px",border:"none",backgroundColor:"#dc2626",color:"white",cursor:"pointer",fontSize:"12px",fontWeight:"600"}}>Sí</button>
                  <button onClick={()=>setConfirmDelId("")} style={{padding:"5px 10px",borderRadius:"6px",border:"1.5px solid #e5e7eb",backgroundColor:"white",cursor:"pointer",fontSize:"12px"}}>No</button>
                </>
              ):(
                <>
                  <button onClick={()=>editar(e)} style={{padding:"5px 10px",borderRadius:"6px",border:"1.5px solid #e5e7eb",backgroundColor:"white",cursor:"pointer",fontSize:"12px"}}>✏️</button>
                  <button onClick={()=>setConfirmDelId(e.id)} style={{padding:"5px 10px",borderRadius:"6px",border:"none",backgroundColor:"#fef2f2",color:"#dc2626",cursor:"pointer",fontSize:"12px"}}>🗑️</button>
                </>
              )}
            </div>
          </div>
        ))}
      </div>}
    </div>
  );
}

// ============================================================
// PANEL RRHH — SOLICITUDES (todas)
// ============================================================
function RRHHSolicitudes({sols, recargar}){
  const [filtro,setFiltro]=useState("Todas");
  const [busqueda,setBusqueda]=useState("");
  const [sel,setSel]=useState(null);
  const [confirmDel,setConfirmDel]=useState(false);
  const ESTADOS=["Todas","Pendiente","Aprobada","Rechazada"];
  const b=busqueda.trim().toLowerCase();
  const filtradas=sols
    .filter(s=>filtro==="Todas"||s.estado===filtro)
    .filter(s=>!b||[s.nombreEmpleado,s.ci,s.cargo,s.area,s.jefeNombre].filter(Boolean).some(v=>v.toLowerCase().includes(b)));

  const cambiarEstado=async(s,est)=>{
    await DB.solUpdate(s.id,{estado:est,fechaResolucion:new Date().toISOString()});
    recargar(); setSel(null);
  };

  const eliminar=async s=>{
    await DB.solDelete(s.id);
    setConfirmDel(false); setSel(null);
    recargar();
  };

  if(sel){
    const c=EC[sel.estado]||EC.Pendiente;
    return(
      <div>
        <button onClick={()=>{setSel(null);setConfirmDel(false);}} style={{marginBottom:"12px",color:COLOR_RED,background:"none",border:"none",cursor:"pointer"}}>← Lista</button>
        <div style={CARD}>
          <div style={{backgroundColor:COLOR_DARK,color:"white",padding:"20px 24px",display:"flex",justifyContent:"space-between"}}>
            <div><h3 style={{margin:0,fontSize:"16px"}}>{sel.nombreEmpleado}</h3><p style={{margin:"3px 0 0",color:"#93c5fd",fontSize:"13px"}}>{sel.cargo} — {sel.area}</p></div>
            <span style={{backgroundColor:c.bg,color:c.text,border:`1px solid ${c.border}`,padding:"4px 10px",borderRadius:"20px",fontSize:"12px",fontWeight:"600",height:"fit-content"}}>{sel.estado}</span>
          </div>
          <div style={{padding:"20px 24px"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",fontSize:"13px"}}>
              {[["N°",sel.numero],["Jefe",sel.jefeNombre||"—"],["Tipo",sel.tipo],["Modalidad",fmtMd(sel.modalidad,sel.horasPorDia)],["Inicio",fmtD(sel.fechaInicio)],["Fin",fmtD(sel.fechaFin)],["Días",`${sel.diasEstimados} día(s)`],["CI",sel.ci]].map(([k,v])=>(
                <div key={k}><div style={{color:"#9ca3af",fontSize:"11px"}}>{k}</div><div style={{fontWeight:"600"}}>{v}</div></div>
              ))}
            </div>
            <div style={{display:"flex",gap:"8px",marginTop:"20px",flexWrap:"wrap"}}>
              {sel.estado!=="Aprobada"&&<button onClick={()=>cambiarEstado(sel,"Aprobada")} style={{...BTN_PRIMARY,backgroundColor:"#16a34a"}}>✅ Aprobar</button>}
              {sel.estado!=="Rechazada"&&<button onClick={()=>cambiarEstado(sel,"Rechazada")} style={{...BTN_PRIMARY,backgroundColor:"#dc2626"}}>❌ Rechazar</button>}
              {sel.estado!=="Pendiente"&&<button onClick={()=>cambiarEstado(sel,"Pendiente")} style={{...BTN_PRIMARY,backgroundColor:"#ca8a04"}}>🔄 Volver a pendiente</button>}
              {!confirmDel&&<button onClick={()=>setConfirmDel(true)} style={{...BTN_SECONDARY,color:"#dc2626",borderColor:"#fecaca"}}>🗑️ Eliminar</button>}
              {confirmDel&&<>
                <span style={{fontSize:"13px",color:"#dc2626",fontWeight:"600",alignSelf:"center"}}>¿Eliminar definitivamente?</span>
                <button onClick={()=>eliminar(sel)} style={{...BTN_PRIMARY,backgroundColor:"#dc2626"}}>Sí, eliminar</button>
                <button onClick={()=>setConfirmDel(false)} style={BTN_SECONDARY}>Cancelar</button>
              </>}
            </div>
          </div>
        </div>
      </div>
    );
  }

  return(
    <div>
      <input value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="🔍 Buscar por nombre, CI, cargo o área..." style={{...INP,marginBottom:"12px"}}/>
      <div style={{display:"flex",gap:"6px",marginBottom:"14px",flexWrap:"wrap"}}>
        {ESTADOS.map(e=><button key={e} onClick={()=>setFiltro(e)} style={{padding:"6px 14px",borderRadius:"20px",border:`1.5px solid ${filtro===e?COLOR_RED:"#e5e7eb"}`,backgroundColor:filtro===e?COLOR_RED:"white",color:filtro===e?"white":"#6b7280",cursor:"pointer",fontSize:"13px"}}>{e}</button>)}
      </div>
      {filtradas.length===0?<div style={{textAlign:"center",padding:"40px",color:"#9ca3af"}}>No hay solicitudes.</div>:
      <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
        {filtradas.map(s=>{
          const c=EC[s.estado]||EC.Pendiente;
          return(
            <div key={s.id} onClick={()=>setSel(s)} style={{...CARD,padding:"14px 18px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:"600",fontSize:"14px"}}>{s.nombreEmpleado}</div>
                <div style={{color:"#9ca3af",fontSize:"12px",marginTop:"3px"}}>📅 {fmtD(s.fechaInicio)} → {fmtD(s.fechaFin)} · {s.diasEstimados} día(s) · Jefe: {s.jefeNombre||"—"}</div>
              </div>
              <span style={{backgroundColor:c.bg,color:c.text,border:`1px solid ${c.border}`,padding:"4px 10px",borderRadius:"20px",fontSize:"11px",fontWeight:"600"}}>{s.estado}</span>
            </div>
          );
        })}
      </div>}
    </div>
  );
}

// ============================================================
// PANEL RRHH — REGISTRAR VACACIÓN YA TOMADA (retroactiva, queda Aprobada)
// ============================================================
function RRHHRegistrarVacacion({emps, sols, recargar}){
  const [empId,setEmpId]=useState("");
  const [tipo,setTipo]=useState("VACACION");
  const [modalidad,setModalidad]=useState("DIA_COMPLETO");
  const [horasPorDia,setHorasPorDia]=useState("1");
  const [fechaInicio,setFechaInicio]=useState("");
  const [fechaFin,setFechaFin]=useState("");
  const [observaciones,setObservaciones]=useState("");
  const [error,setError]=useState("");
  const [msg,setMsg]=useState("");
  const [saving,setSaving]=useState(false);

  const emp=emps.find(e=>e.id===empId);
  const saldoActual=emp?calcSaldoActual(emp,sols):0;
  const diasCalc=(emp&&fechaInicio&&fechaFin)?calcDias(fechaInicio,fechaFin,modalidad,horasPorDia,[],emp.fechaNacimiento||null,emp.horarioSemana||"L-V"):{dias:0,feriadosEnRango:[],cumpleEnRango:null};

  const registrar=async()=>{
    setError(""); setMsg("");
    if(!emp){setError("Selecciona un empleado.");return;}
    if(!fechaInicio||!fechaFin){setError("Completa las fechas.");return;}
    if(fechaFin<fechaInicio){setError("La fecha fin no puede ser menor a la de inicio.");return;}
    if(modalidad==="HORA"&&!(parseFloat(horasPorDia)>0)){setError("Ingresa las horas por día.");return;}
    setSaving(true);
    try{
      const jefe=emp.jefeCi?await DB.empGetByCi(emp.jefeCi):null;
      const nueva={
        numero:genNum(), empleadoCi:emp.ci, nombreEmpleado:emp.nombre, ci:emp.ci,
        cargo:emp.cargo, area:emp.area, sucursal:emp.sucursal||"", fechaIngreso:emp.fechaIngreso||"",
        codigo:emp.codigo||"", diasDisponibles:String(saldoActual),
        tipo, modalidad, horasPorDia,
        fechaInicio, fechaFin, fechaRetorno:"",
        observaciones:observaciones||"Registrada por RRHH (vacación ya tomada).",
        diasEstimados:diasCalc.dias, feriadosEnRango:diasCalc.feriadosEnRango, cumpleEnRango:diasCalc.cumpleEnRango,
        estado:"Aprobada", jefeCi:emp.jefeCi||"", jefeNombre:jefe?jefe.nombre:"",
        fechaSolicitud:new Date().toISOString(), fechaResolucion:new Date().toISOString(),
        registradaPorRRHH:true,
      };
      await DB.solCreate(nueva);
      setMsg(`✅ Registrada: se descontaron ${diasCalc.dias} día(s) del saldo de ${emp.nombre}.`);
      setEmpId(""); setFechaInicio(""); setFechaFin(""); setObservaciones(""); setModalidad("DIA_COMPLETO"); setHorasPorDia("1");
      recargar();
    }catch(e){ setError("No se pudo registrar. Intenta de nuevo."); }
    setSaving(false);
  };

  return(
    <div style={{maxWidth:"560px"}}>
      <div style={{fontSize:"16px",fontWeight:"700",marginBottom:"6px"}}>Registrar vacación ya tomada</div>
      <p style={{fontSize:"12px",color:"#9ca3af",marginBottom:"16px"}}>Úsalo para empleados que ya pidieron y tomaron sus vacaciones fuera del sistema — queda registrada como Aprobada de inmediato y descuenta su saldo.</p>
      {msg&&<div style={{padding:"10px 14px",backgroundColor:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:"8px",color:"#166534",fontSize:"13px",marginBottom:"12px"}}>{msg}</div>}
      {error&&<div style={{padding:"10px 14px",backgroundColor:"#fef2f2",border:"1px solid #fecaca",borderRadius:"8px",color:"#dc2626",fontSize:"13px",marginBottom:"12px"}}>⚠️ {error}</div>}
      <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
        <div>
          <label style={LBL}>Empleado *</label>
          <select style={INP} value={empId} onChange={e=>setEmpId(e.target.value)}>
            <option value="">— Selecciona —</option>
            {emps.filter(e=>!e.cuentaAdmin).sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(e=><option key={e.id} value={e.id}>{e.nombre} ({e.ci})</option>)}
          </select>
          {emp&&<div style={{marginTop:"4px",fontSize:"12px",color:COLOR_RED,fontWeight:"600"}}>Saldo actual: {saldoActual} día(s)</div>}
        </div>
        <div>
          <label style={LBL}>Tipo</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
            {Object.entries(TIPO_CFG).map(([v,t])=>(
              <button key={v} onClick={()=>setTipo(v)} style={{padding:"9px 12px",borderRadius:"8px",border:`1.5px solid ${tipo===v?COLOR_RED:"#e5e7eb"}`,backgroundColor:tipo===v?"#fef2f2":"white",color:tipo===v?COLOR_RED:"#6b7280",fontWeight:tipo===v?"700":"400",cursor:"pointer",fontSize:"13px"}}>{t.icon} {t.label}</button>
            ))}
          </div>
        </div>
        <div>
          <label style={LBL}>Modalidad</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
            {MODALIDADES.map(m=>(
              <button key={m.value} onClick={()=>setModalidad(m.value)} style={{padding:"9px 12px",borderRadius:"8px",border:`1.5px solid ${modalidad===m.value?COLOR_RED:"#e5e7eb"}`,backgroundColor:modalidad===m.value?"#fef2f2":"white",color:modalidad===m.value?COLOR_RED:"#6b7280",fontWeight:modalidad===m.value?"700":"400",cursor:"pointer",fontSize:"13px"}}>{m.label}</button>
            ))}
          </div>
          {modalidad==="HORA"&&<div style={{marginTop:"10px",display:"flex",alignItems:"center",gap:"10px"}}>
            <label style={{...LBL,margin:0}}>Horas por día *</label>
            <input type="number" min="0.5" max="8" step="0.5" style={{...INP,width:"80px"}} value={horasPorDia} onChange={e=>setHorasPorDia(e.target.value)}/>
          </div>}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
          <div><label style={LBL}>Fecha inicio *</label><input type="date" style={INP} value={fechaInicio} onChange={e=>setFechaInicio(e.target.value)}/></div>
          <div><label style={LBL}>Fecha fin *</label><input type="date" style={INP} value={fechaFin} min={fechaInicio} onChange={e=>setFechaFin(e.target.value)}/></div>
        </div>
        {emp&&fechaInicio&&fechaFin&&<div style={{padding:"8px 12px",backgroundColor:"#f9fafb",borderRadius:"8px",fontSize:"13px"}}>Días {modalidad==="HORA"?"(equivalentes)":"hábiles"}: <strong>{diasCalc.dias}</strong></div>}
        <div><label style={LBL}>Observaciones (opcional)</label><textarea style={{...INP,minHeight:"60px",resize:"vertical"}} value={observaciones} onChange={e=>setObservaciones(e.target.value)}/></div>
        <button onClick={registrar} disabled={saving} style={{...BTN_PRIMARY,opacity:saving?0.6:1}}>{saving?"Registrando...":"✅ Registrar como Aprobada"}</button>
      </div>
    </div>
  );
}

// ============================================================
// PANEL RRHH — SOLICITAR EN NOMBRE DE UN EMPLEADO (sin necesidad de cuenta)
// ============================================================
function RRHHSolicitarPorEmpleado({emps, sols, recargar}){
  const [empId,setEmpId]=useState("");
  const [step,setStep]=useState("form");
  const [solGuardada,setSolGuardada]=useState(null);
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState("");
  const [feriadosVar,setFeriadosVar]=useState([]);
  const [form,setForm]=useState({
    tipo:"VACACION",modalidad:"DIA_COMPLETO",horasPorDia:"1",
    fechaInicio:"",fechaFin:"",fechaRetorno:"",observaciones:""
  });
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  const emp=emps.find(e=>e.id===empId);

  useEffect(()=>{
    const yr=new Date().getFullYear();
    Promise.all([DB.ferGet(yr),DB.ferGet(yr+1)]).then(([a,b])=>setFeriadosVar([...a,...b]));
  },[]);

  const calcResult=useMemo(()=>emp?calcDias(form.fechaInicio,form.fechaFin,form.modalidad,form.horasPorDia,feriadosVar,emp.fechaNacimiento||null,emp.horarioSemana||"L-V"):{dias:0,feriadosEnRango:[],cumpleEnRango:null},
    [emp,form.fechaInicio,form.fechaFin,form.modalidad,form.horasPorDia,feriadosVar]);

  const saldoActual=useMemo(()=>emp?calcSaldoActual(emp,sols):0,[emp,sols]);

  const validar=()=>{
    if(!emp) return "Selecciona un empleado.";
    if(!form.fechaInicio) return "Selecciona la fecha de inicio.";
    if(!form.fechaFin) return "Selecciona la fecha de fin.";
    if(form.fechaFin<form.fechaInicio) return "La fecha fin no puede ser menor a la fecha inicio.";
    if(form.modalidad==="HORA"&&!(parseFloat(form.horasPorDia)>0)) return "Ingresa las horas por día.";
    return "";
  };

  const reset=()=>{setStep("form");setSolGuardada(null);setEmpId("");setForm({tipo:"VACACION",modalidad:"DIA_COMPLETO",horasPorDia:"1",fechaInicio:"",fechaFin:"",fechaRetorno:"",observaciones:""});};

  const generar=async()=>{
    const err=validar(); if(err){setError(err);return;}
    setError(""); setSaving(true);
    try{
      const jefe=emp.jefeCi?await DB.empGetByCi(emp.jefeCi):null;
      const nueva={
        numero:genNum(), empleadoCi:emp.ci, nombreEmpleado:emp.nombre, ci:emp.ci,
        cargo:emp.cargo, area:emp.area, sucursal:emp.sucursal||"", fechaIngreso:emp.fechaIngreso||"",
        codigo:emp.codigo||"", diasDisponibles:String(saldoActual),
        tipo:form.tipo, modalidad:form.modalidad, horasPorDia:form.horasPorDia,
        fechaInicio:form.fechaInicio, fechaFin:form.fechaFin, fechaRetorno:form.fechaRetorno,
        observaciones:form.observaciones, diasEstimados:calcResult.dias,
        feriadosEnRango:calcResult.feriadosEnRango, cumpleEnRango:calcResult.cumpleEnRango,
        estado:"Pendiente", jefeCi:emp.jefeCi||"", jefeNombre:jefe?jefe.nombre:"",
        fechaSolicitud:new Date().toISOString(), creadaPorRRHH:true,
      };
      const id=await DB.solCreate(nueva);
      setSolGuardada({...nueva,id}); setStep("preview");
      recargar();
    }catch(e){ setError("No se pudo guardar la solicitud. Intenta de nuevo."); }
    setSaving(false);
  };

  if(step==="preview"&&solGuardada) return(
    <div>
      <div className="print-hidden" style={{display:"flex",gap:"10px",marginBottom:"14px",flexWrap:"wrap"}}>
        <button onClick={()=>window.print()} style={BTN_PRIMARY}>🖨️ Imprimir formulario</button>
        <button onClick={reset} style={BTN_SECONDARY}>Nueva solicitud</button>
      </div>
      <div className="print-hidden" style={{marginBottom:"12px",padding:"10px 14px",backgroundColor:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:"8px",color:"#166534",fontSize:"13px"}}>
        ✅ Solicitud creada para {solGuardada.nombreEmpleado}{solGuardada.jefeNombre?` — pendiente de aprobación de ${solGuardada.jefeNombre}`:""}. Imprime el formulario para que lo firmen.
      </div>
      <PrintForm s={solGuardada}/>
    </div>
  );

  const {dias:diasCalc,feriadosEnRango:fers,cumpleEnRango:cumple}=calcResult;
  return(
    <div style={{maxWidth:"640px",margin:"0 auto"}}>
      <p style={{fontSize:"12px",color:"#9ca3af",marginBottom:"14px"}}>Úsalo cuando un empleado te pida hacer su solicitud pero no tiene (o no quiere crear) una cuenta en el sistema. La solicitud queda como Pendiente y sigue el flujo normal de aprobación con su jefe.</p>
      <div style={CARD}>
        <div style={{backgroundColor:COLOR_DARK,color:"white",padding:"20px 24px"}}>
          <h2 style={{margin:0,fontSize:"18px",fontWeight:"700"}}>Nueva Solicitud (por RRHH)</h2>
          <p style={{margin:"4px 0 0",fontSize:"13px",color:"#93c5fd"}}>{emp?`${emp.nombre} — ${emp.cargo}`:"Selecciona un empleado"}</p>
        </div>
        <div style={{padding:"24px",display:"flex",flexDirection:"column",gap:"20px"}}>
          <div>
            <label style={LBL}>Empleado *</label>
            <select style={INP} value={empId} onChange={e=>setEmpId(e.target.value)}>
              <option value="">— Selecciona —</option>
              {emps.filter(e=>!e.cuentaAdmin).sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(e=><option key={e.id} value={e.id}>{e.nombre} ({e.ci})</option>)}
            </select>
          </div>
          {emp&&<div style={{padding:"10px 14px",backgroundColor:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:"8px",fontSize:"13px",color:"#1e40af"}}>
            🏖️ Saldo actual disponible: <strong>{saldoActual} día(s)</strong>
            {emp.jefeCi&&<div style={{marginTop:"2px"}}>La solicitud se enviará a su jefe inmediato para aprobación.</div>}
            {!emp.jefeCi&&<div style={{marginTop:"2px",color:"#92400e"}}>⚠️ No tiene un jefe asignado. Configúralo en Empleados si quieres que pase por aprobación.</div>}
          </div>}
          <div>
            <div style={LBL}>Tipo de solicitud</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}}>
              {Object.entries(TIPO_CFG).map(([v,t])=>(
                <button key={v} onClick={()=>set("tipo",v)} style={{padding:"12px",borderRadius:"10px",border:`2px solid ${form.tipo===v?COLOR_RED:"#e5e7eb"}`,backgroundColor:form.tipo===v?"#fef2f2":"white",cursor:"pointer",textAlign:"left"}}>
                  <div style={{fontSize:"22px"}}>{t.icon}</div>
                  <div style={{fontWeight:"700",fontSize:"13px",color:form.tipo===v?COLOR_RED:"#374151",marginTop:"4px"}}>{t.label}</div>
                  <div style={{fontSize:"11px",color:"#9ca3af"}}>{t.sub}</div>
                </button>
              ))}
            </div>
          </div>
          <div>
            <div style={LBL}>Período solicitado</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
              <div><label style={LBL}>Fecha inicio *</label><input type="date" style={INP} value={form.fechaInicio} onChange={e=>set("fechaInicio",e.target.value)}/></div>
              <div><label style={LBL}>Fecha fin *</label><input type="date" style={INP} value={form.fechaFin} min={form.fechaInicio} onChange={e=>set("fechaFin",e.target.value)}/></div>
              <div><label style={LBL}>Fecha retorno (opcional)</label><input type="date" style={INP} value={form.fechaRetorno} onChange={e=>set("fechaRetorno",e.target.value)}/></div>
              <div><label style={LBL}>Días hábiles estimados</label><div style={{...INP,backgroundColor:"#f9fafb",color:diasCalc>0?COLOR_RED:"#9ca3af",fontWeight:"600"}}>{diasCalc>0?`${diasCalc} día(s)`:"—"}</div></div>
            </div>
            {(fers.length>0||cumple)&&(
              <div style={{marginTop:"10px",display:"flex",flexDirection:"column",gap:"6px"}}>
                {fers.length>0&&<div style={{padding:"8px 12px",backgroundColor:"#fff7ed",border:"1px solid #fed7aa",borderRadius:"8px",fontSize:"12px",color:"#9a3412"}}><strong>🏳️ Feriados excluidos:</strong> {fers.map(f=>`${fmtD(f.fecha)} (${f.desc})`).join(", ")}</div>}
                {cumple&&<div style={{padding:"8px 12px",backgroundColor:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:"8px",fontSize:"12px",color:"#166534"}}>🎉 Cumpleaños el {fmtD(cumple)} — ½ día libre sin descontar.</div>}
              </div>
            )}
            {emp&&form.tipo==="VACACION"&&diasCalc>saldoActual&&(
              <div style={{marginTop:"10px",padding:"8px 12px",backgroundColor:"#fef2f2",border:"1px solid #fecaca",borderRadius:"8px",fontSize:"12px",color:"#dc2626"}}>
                ⚠️ Se están solicitando {diasCalc} día(s), pero el saldo disponible es de {saldoActual} día(s).
              </div>
            )}
          </div>
          <div>
            <label style={LBL}>Modalidad</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
              {MODALIDADES.map(m=>(
                <button key={m.value} onClick={()=>set("modalidad",m.value)} style={{padding:"9px 12px",borderRadius:"8px",border:`1.5px solid ${form.modalidad===m.value?COLOR_RED:"#e5e7eb"}`,backgroundColor:form.modalidad===m.value?"#fef2f2":"white",color:form.modalidad===m.value?COLOR_RED:"#6b7280",fontWeight:form.modalidad===m.value?"700":"400",cursor:"pointer",fontSize:"13px"}}>{m.label}</button>
              ))}
            </div>
            {form.modalidad==="HORA"&&<div style={{marginTop:"10px",display:"flex",alignItems:"center",gap:"10px"}}>
              <label style={{...LBL,margin:0}}>Horas por día *</label>
              <input type="number" min="0.5" max="8" step="0.5" style={{...INP,width:"80px"}} value={form.horasPorDia} onChange={e=>set("horasPorDia",e.target.value)}/>
            </div>}
          </div>
          <div><label style={LBL}>Observaciones (opcional)</label><textarea style={{...INP,minHeight:"70px",resize:"vertical"}} value={form.observaciones} onChange={e=>set("observaciones",e.target.value)}/></div>
          {error&&<div style={{padding:"10px 14px",backgroundColor:"#fef2f2",border:"1px solid #fecaca",borderRadius:"8px",color:"#dc2626",fontSize:"13px"}}>⚠️ {error}</div>}
          <button onClick={generar} disabled={saving} style={{...BTN_PRIMARY,width:"100%",padding:"13px",fontSize:"15px",opacity:saving?0.6:1}}>{saving?"Generando...":"✅ Generar y enviar formulario"}</button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// PANEL RRHH — FERIADOS
// ============================================================
function RRHHFeriados(){
  const curYear=new Date().getFullYear();
  const [year,setYear]=useState(curYear);
  const [ferVar,setFerVar]=useState([]);
  const [loading,setLoading]=useState(true);
  const [fechaNueva,setFechaNueva]=useState("");
  const [descNueva,setDescNueva]=useState("");

  const cargar=async y=>{setLoading(true); setFerVar(await DB.ferGet(y)); setLoading(false);};
  useEffect(()=>{cargar(year);},[year]);

  const agregar=async()=>{
    if(!fechaNueva||!descNueva.trim()) return;
    const nueva=[...ferVar,{fecha:fechaNueva,desc:descNueva}].sort((a,b)=>a.fecha.localeCompare(b.fecha));
    await DB.ferSet(year,nueva); setFerVar(nueva); setFechaNueva(""); setDescNueva("");
  };
  const eliminar=async fecha=>{
    const nueva=ferVar.filter(f=>f.fecha!==fecha); await DB.ferSet(year,nueva); setFerVar(nueva);
  };
  const todos=[...FERIADOS_FIJOS.map(f=>({tipo:"fijo",fecha:`${year}-${f.md}`,desc:f.desc})),...ferVar.map(f=>({tipo:"variable",...f}))].sort((a,b)=>a.fecha.localeCompare(b.fecha));

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}>
        <div style={{fontSize:"16px",fontWeight:"700"}}>Feriados</div>
        <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
          <button onClick={()=>setYear(y=>y-1)} style={{padding:"6px 10px",borderRadius:"6px",border:"1.5px solid #e5e7eb",backgroundColor:"white",cursor:"pointer"}}>‹</button>
          <span style={{fontWeight:"700"}}>{year}</span>
          <button onClick={()=>setYear(y=>y+1)} style={{padding:"6px 10px",borderRadius:"6px",border:"1.5px solid #e5e7eb",backgroundColor:"white",cursor:"pointer"}}>›</button>
        </div>
      </div>
      <div style={{marginBottom:"16px",padding:"14px",backgroundColor:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:"10px",display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"flex-end"}}>
        <div><div style={{fontSize:"12px",fontWeight:"600",marginBottom:"4px"}}>Fecha</div><input type="date" style={{border:"1.5px solid #d1d5db",borderRadius:"8px",padding:"8px 12px"}} value={fechaNueva} onChange={e=>setFechaNueva(e.target.value)} min={`${year}-01-01`} max={`${year}-12-31`}/></div>
        <div style={{flex:1}}><div style={{fontSize:"12px",fontWeight:"600",marginBottom:"4px"}}>Descripción</div><input style={{width:"100%",boxSizing:"border-box",border:"1.5px solid #d1d5db",borderRadius:"8px",padding:"8px 12px"}} value={descNueva} onChange={e=>setDescNueva(e.target.value)} placeholder="Ej: Carnaval"/></div>
        <button onClick={agregar} style={BTN_PRIMARY}>Agregar</button>
      </div>
      {loading?<div style={{textAlign:"center",padding:"30px",color:"#9ca3af"}}>Cargando...</div>:
      <div style={{display:"flex",flexDirection:"column",gap:"4px"}}>
        {todos.map((f,i)=>(
          <div key={i} style={{backgroundColor:"white",borderRadius:"8px",padding:"10px 14px",border:"1px solid #e5e7eb",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
              <span style={{backgroundColor:f.tipo==="fijo"?"#eff6ff":"#fff7ed",color:f.tipo==="fijo"?"#1e40af":"#9a3412",padding:"2px 8px",borderRadius:"10px",fontSize:"10px",fontWeight:"600"}}>{f.tipo==="fijo"?"FIJO":"VARIABLE"}</span>
              <span style={{fontWeight:"600",fontSize:"13px"}}>{fmtD(f.fecha)}</span>
              <span style={{fontSize:"13px",color:"#6b7280"}}>{f.desc}</span>
            </div>
            {f.tipo==="variable"&&<button onClick={()=>eliminar(f.fecha)} style={{padding:"4px 8px",borderRadius:"6px",border:"none",backgroundColor:"#fef2f2",color:"#dc2626",cursor:"pointer"}}>🗑️</button>}
          </div>
        ))}
      </div>}
    </div>
  );
}

// APP PRINCIPAL
// ============================================================
function CambiarPasswordModal({onClose}){
  const [actual,setActual]=useState("");
  const [nueva,setNueva]=useState("");
  const [confirmar,setConfirmar]=useState("");
  const [error,setError]=useState("");
  const [msg,setMsg]=useState("");
  const [loading,setLoading]=useState(false);

  const guardar=async()=>{
    setError(""); setMsg("");
    if(!nueva||nueva.length<6){ setError("La nueva contraseña debe tener al menos 6 caracteres."); return; }
    if(nueva!==confirmar){ setError("Las contraseñas no coinciden."); return; }
    setLoading(true);
    try{
      const user=window.__fbAuth.currentUser;
      if(actual){
        const cred=firebase.auth.EmailAuthProvider.credential(user.email,actual);
        await user.reauthenticateWithCredential(cred);
      }
      await user.updatePassword(nueva);
      setMsg("✅ Contraseña actualizada correctamente.");
      setActual(""); setNueva(""); setConfirmar("");
    }catch(e){
      setError(e.code==="auth/wrong-password"?"La contraseña actual no es correcta.":
        e.code==="auth/requires-recent-login"?"Por seguridad, cierra sesión, vuelve a entrar, e intenta cambiarla de inmediato.":
        e.code==="auth/weak-password"?"La contraseña es muy débil.":
        "No se pudo cambiar la contraseña. Intenta de nuevo.");
    }
    setLoading(false);
  };

  return(
    <div style={{position:"fixed",inset:0,backgroundColor:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:"16px"}} onClick={onClose}>
      <div style={{...CARD,maxWidth:"360px",width:"100%",padding:"24px"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:"16px",fontWeight:"700",marginBottom:"14px"}}>🔑 Cambiar contraseña</div>
        {msg&&<div style={{padding:"10px 14px",backgroundColor:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:"8px",color:"#166534",fontSize:"13px",marginBottom:"12px"}}>{msg}</div>}
        {error&&<div style={{padding:"10px 14px",backgroundColor:"#fef2f2",border:"1px solid #fecaca",borderRadius:"8px",color:"#dc2626",fontSize:"13px",marginBottom:"12px"}}>⚠️ {error}</div>}
        <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
          <PasswordField label="Contraseña actual (si te la pide)" value={actual} onChange={e=>setActual(e.target.value)}/>
          <PasswordField label="Contraseña nueva" value={nueva} onChange={e=>setNueva(e.target.value)} placeholder="Mínimo 6 caracteres"/>
          <PasswordField label="Confirmar contraseña nueva" value={confirmar} onChange={e=>setConfirmar(e.target.value)}/>
          <button onClick={guardar} disabled={loading} style={{...BTN_PRIMARY,width:"100%"}}>{loading?"Guardando...":"Guardar"}</button>
          <button onClick={onClose} style={{...BTN_SECONDARY,width:"100%"}}>Cerrar</button>
        </div>
      </div>
    </div>
  );
}

function AppMain(){
  const [user,setUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [miEmpleado,setMiEmpleado]=useState(null);
  const [emps,setEmps]=useState([]);
  const [sols,setSols]=useState([]);
  const [view,setView]=useState("solicitar");
  const [showPassModal,setShowPassModal]=useState(false);

  const recargarTodo=async(uidActual)=>{
    const [e,s]=await Promise.all([DB.empGetAll(),DB.solGetAll()]);
    setEmps(e); setSols(s);
    const uid=uidActual!==undefined?uidActual:user?.uid;
    if(uid){ const mi=e.find(x=>x.uid===uid); setMiEmpleado(mi||null); }
  };

  useEffect(()=>{
    const unsub=window.__fbAuth.onAuthStateChanged(async u=>{
      setUser(u);
      if(u){ await recargarTodo(u.uid); } else { setMiEmpleado(null); setEmps([]); setSols([]); }
      setAuthLoading(false);
    });
    return unsub;
  },[]);

  useEffect(()=>{
    if(miEmpleado?.cuentaAdmin && view==="solicitar") setView("rrhh_emp");
  },[miEmpleado]);

  if(authLoading) return <div style={{textAlign:"center",padding:"60px",color:"#9ca3af"}}>Cargando...</div>;
  if(!user) return <AuthScreen/>;
  if(!miEmpleado) return (
    <div style={{maxWidth:"420px",margin:"60px auto",textAlign:"center",padding:"24px"}}>
      <div style={{fontSize:"36px",marginBottom:"8px"}}>⏳</div>
      <p style={{color:"#6b7280"}}>Tu cuenta se creó, pero aún no está vinculada a ningún registro de empleado. Contacta a RRHH.</p>
      <button onClick={()=>window.__fbAuth.signOut()} style={{...BTN_SECONDARY,marginTop:"12px"}}>Cerrar sesión</button>
    </div>
  );

  const tieneEquipo=emps.some(e=>e.jefeCi===miEmpleado.ci);
  const esCuentaAdmin=!!miEmpleado.cuentaAdmin;
  const TABS=[
    ...(esCuentaAdmin?[]:[{id:"solicitar",label:"🏖️ Solicitar"},{id:"mis_sol",label:"📄 Mis Solicitudes"}]),
    ...(!esCuentaAdmin&&tieneEquipo?[{id:"aprobaciones",label:"✅ Aprobaciones"}]:[]),
    ...(miEmpleado.esRRHH?[{id:"rrhh_emp",label:"👥 Empleados"},{id:"rrhh_sol_por_emp",label:"📝 Solicitar por Empleado"},{id:"rrhh_reg",label:"➕ Registrar Vacación"},{id:"rrhh_sol",label:"📋 Solicitudes"},{id:"rrhh_fer",label:"🏳️ Feriados"}]:[]),
  ];

  return(
    <div style={{minHeight:"100vh",backgroundColor:"#f3f4f6"}}>
      {showPassModal&&<CambiarPasswordModal onClose={()=>setShowPassModal(false)}/>}
      <div className="print-hidden" style={{backgroundColor:COLOR_DARK,color:"white",padding:"12px 24px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px"}}>
        <div style={{fontWeight:"700",fontSize:"14px"}}>{COMPANY_FULL}</div>
        <div style={{display:"flex",alignItems:"center",gap:"12px",fontSize:"13px"}}>
          <span>{miEmpleado.nombre}</span>
          <button onClick={()=>setShowPassModal(true)} style={{background:"none",border:"1px solid rgba(255,255,255,0.4)",color:"white",padding:"5px 12px",borderRadius:"6px",cursor:"pointer",fontSize:"12px"}}>🔑 Contraseña</button>
          <button onClick={()=>window.__fbAuth.signOut()} style={{background:"none",border:"1px solid rgba(255,255,255,0.4)",color:"white",padding:"5px 12px",borderRadius:"6px",cursor:"pointer",fontSize:"12px"}}>Salir</button>
        </div>
      </div>
      <div className="print-hidden" style={{maxWidth:"900px",margin:"0 auto",padding:"12px 16px 0",display:"flex",gap:"4px",flexWrap:"wrap",borderBottom:"2px solid #e5e7eb"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setView(t.id)} style={{padding:"10px 16px",border:"none",borderBottom:`2px solid ${view===t.id?COLOR_RED:"transparent"}`,marginBottom:"-2px",backgroundColor:"transparent",color:view===t.id?COLOR_RED:"#6b7280",fontWeight:view===t.id?"700":"400",cursor:"pointer",fontSize:"14px"}}>{t.label}</button>
        ))}
      </div>
      <div style={{maxWidth:"900px",margin:"0 auto",padding:"24px 16px"}}>
        {view==="solicitar"&&<SolicitarView miEmpleado={miEmpleado} sols={sols} recargar={recargarTodo}/>}
        {view==="mis_sol"&&<MisSolicitudesView miEmpleado={miEmpleado} sols={sols} recargar={recargarTodo}/>}
        {view==="aprobaciones"&&tieneEquipo&&<AprobacionesView miEmpleado={miEmpleado} sols={sols} recargar={recargarTodo}/>}
        {view==="rrhh_emp"&&miEmpleado.esRRHH&&<RRHHEmpleados emps={emps} sols={sols} recargar={recargarTodo}/>}
        {view==="rrhh_sol_por_emp"&&miEmpleado.esRRHH&&<RRHHSolicitarPorEmpleado emps={emps} sols={sols} recargar={recargarTodo}/>}
        {view==="rrhh_reg"&&miEmpleado.esRRHH&&<RRHHRegistrarVacacion emps={emps} sols={sols} recargar={recargarTodo}/>}
        {view==="rrhh_sol"&&miEmpleado.esRRHH&&<RRHHSolicitudes sols={sols} recargar={recargarTodo}/>}
        {view==="rrhh_fer"&&miEmpleado.esRRHH&&<RRHHFeriados/>}
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<AppMain/>);
</script>

<script>
// Transformacion manual con Babel, forzando el runtime "classic" de JSX
// (evita que Babel intente usar "import" internamente, lo cual falla fuera de un modulo)
(function(){
  var code = document.getElementById("app-source").textContent;
  var output = Babel.transform(code, {
    presets: [["react", {runtime: "classic"}]]
  }).code;
  var script = document.createElement("script");
  script.textContent = output;
  document.body.appendChild(script);
})();
</script>
